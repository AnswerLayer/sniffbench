id: bootstrap-011
title: "Write Unit Tests for Untested Code"
prompt: |
  The following Python module has no unit tests. Write comprehensive unit tests
  to cover all functions and edge cases.

  The tests should:
  - Cover all public functions
  - Test normal cases
  - Test edge cases (empty inputs, None, etc.)
  - Test error conditions
  - Use proper test assertions
  - Follow testing best practices

  Run: python test_all.py

source: bootstrap
category: testing
language: python
difficulty: easy

tags:
  - python
  - testing
  - unit-tests
  - test-coverage

files:
  - path: calculator.py
    content: |
      class Calculator:
          def add(self, a, b):
              return a + b

          def subtract(self, a, b):
              return a - b

          def multiply(self, a, b):
              return a * b

          def divide(self, a, b):
              if b == 0:
                  raise ValueError("Cannot divide by zero")
              return a / b

          def power(self, base, exponent):
              return base ** exponent

          def factorial(self, n):
              if n < 0:
                  raise ValueError("Factorial is not defined for negative numbers")
              if n == 0 or n == 1:
                  return 1
              result = 1
              for i in range(2, n + 1):
                  result *= i
              return result

          def is_prime(self, n):
              if n <= 1:
                  return False
              if n == 2:
                  return True
              if n % 2 == 0:
                  return False
              for i in range(3, int(n**0.5) + 1, 2):
                  if n % i == 0:
                      return False
              return True
