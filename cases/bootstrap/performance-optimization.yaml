id: bootstrap-011
title: "Optimize Performance Bottlenecks"
prompt: |
  The following code has performance issues. Optimize it by:
  - Identifying and fixing N+1 query problems
  - Reducing redundant computations
  - Using more efficient algorithms
  - Adding appropriate caching where beneficial

  Run: python performance_optimization.test.py
  Make all tests pass.

source: bootstrap
category: performance
language: python
difficulty: medium

tags:
  - python
  - performance
