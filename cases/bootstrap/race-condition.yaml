id: bootstrap-014
title: "Fix Race Conditions in Concurrent Code"
prompt: |
  The following Python code has a race condition when multiple threads try to
  increment a shared counter simultaneously.

  Fix the race condition by:
  - Using proper synchronization mechanisms (locks, semaphores, etc.)
  - Ensuring thread safety
  - Preventing data corruption
  - Maintaining the same functionality
  - Using appropriate concurrency primitives

  Run: python race_condition_test.py

source: bootstrap
category: concurrency
language: python
difficulty: hard

tags:
  - python
  - concurrency
  - race-condition
  - thread-safety

files:
  - path: counter.py
    content: |
      import threading
      import time
      from typing import List

      class Counter:
          def __init__(self):
              self.count = 0
              self.lock = threading.Lock()

          def increment(self):
              # VULNERABLE: Race condition - multiple threads can read and write simultaneously
              self.count += 1

          def get_count(self) -> int:
              return self.count

      def worker(counter: Counter, iterations: int, results: List[int]):
          for _ in range(iterations):
              counter.increment()
          results.append(counter.get_count())

      if __name__ == '__main__':
          counter = Counter()
          num_threads = 10
          iterations_per_thread = 1000
          results = []

          threads = []
          for _ in range(num_threads):
              t = threading.Thread(target=worker, args=(counter, iterations_per_thread, results))
              threads.append(t)
              t.start()

          for t in threads:
              t.join()

          print(f"Expected count: {num_threads * iterations_per_thread}")
          print(f"Actual count: {counter.get_count()}")
          print(f"Results: {results}")
